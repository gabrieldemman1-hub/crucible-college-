# Deploys the site to GitHub Pages — MANUAL TRIGGER ONLY.
# Nothing deploys on push or merge. To publish: GitHub → Actions →
# "Deploy to GitHub Pages" → Run workflow. Heads up: every GitHub Pages
# site on a personal account is publicly reachable by anyone with the URL.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with the project-page path prefix
        run: npx eleventy
        env:
          PATHPREFIX: /crucible-college-/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
